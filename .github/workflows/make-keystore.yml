name: Generate release signing keystore (one-time)

# 审计 A-03：不再生成/入库 debug keystore。
# 本工作流只用于【一次性】生成正式发布 keystore，产物通过 artifact 下载后
# 由仓库管理员填入 Settings -> Secrets and variables -> Actions 的 4 个 Secret。
# 注意：artifact 内含私钥与口令，配置完 Secret 后请立即删除该 artifact / 本次 workflow run。
on:
  workflow_dispatch:

jobs:
  make:
    runs-on: ubuntu-latest
    steps:
      - name: Generate release keystore
        run: |
          PW=$(openssl rand -hex 16)
          keytool -genkeypair -v -keystore lateshow-release.jks -alias lateshow \
            -keyalg RSA -keysize 2048 -validity 10000 \
            -storepass "$PW" -keypass "$PW" \
            -dname "CN=Late Show,O=LateShow,C=CN" >/dev/null
          base64 -w0 lateshow-release.jks > SIGNING_KEYSTORE_BASE64.txt
          cat > README.txt <<EOF
          把这 4 个值填入仓库 Settings -> Secrets and variables -> Actions：
            SIGNING_KEYSTORE_BASE64 = SIGNING_KEYSTORE_BASE64.txt 的内容（单行 base64）
            SIGNING_STORE_PASSWORD  = $PW
            SIGNING_KEY_ALIAS       = lateshow
            SIGNING_KEY_PASSWORD   = $PW
          配置完成后请删除本 workflow run 与 artifact（内含私钥与口令）。
          私钥一旦丢失将无法再发布可覆盖安装的更新包，请离线妥善保存一份。
          EOF
          zip -j release-signing.zip SIGNING_KEYSTORE_BASE64.txt README.txt

      - uses: actions/upload-artifact@v4
        with:
          name: release-signing
          path: release-signing.zip
          retention-days: 1
