plugins {
    id 'com.android.application'
}

// 版本号（审计 A-31）：优先读 CI/本地显式环境变量，未设置时再回退 GITHUB_RUN_NUMBER。
// 本地构建给 1001 而不是 1，避免本地产物因 versionCode 过低无法覆盖安装。
def ghRun = System.getenv("GITHUB_RUN_NUMBER")
def buildNo = (ghRun != null && ghRun.isInteger()) ? ghRun.toInteger() : 0
def envCode = System.getenv("LATESHOW_VERSION_CODE")
def envName = System.getenv("LATESHOW_VERSION_NAME")
def appVersionCode = (envCode != null && envCode.isInteger()) ? envCode.toInteger()
        : (buildNo > 0 ? 1000 + buildNo : 1001)
def appVersionName = (envName != null && !envName.trim().isEmpty()) ? envName.trim()
        : (buildNo > 0 ? "1.5.${buildNo}" : "1.5.0")

android {
    namespace 'com.lateshow.app'
    compileSdk 34

    defaultConfig {
        applicationId "com.lateshow.app"
        minSdk 24
        targetSdk 34
        versionCode appVersionCode
        versionName appVersionName
    }

    buildFeatures {
        buildConfig true
    }

    // 审计 A-02/A-03：正式签名完全来自 CI Secrets，仓库内不再有任何密钥与口令。
    // debug 构建使用 AGP 默认的 ~/.android/debug.keystore（不再入库、不再硬编码 android/android）。
    signingConfigs {
        release {
            def store = System.getenv("SIGNING_STORE_FILE")
            if (store != null && !store.trim().isEmpty()) {
                storeFile file(store.trim())
                storePassword System.getenv("SIGNING_STORE_PASSWORD")
                keyAlias System.getenv("SIGNING_KEY_ALIAS")
                keyPassword System.getenv("SIGNING_KEY_PASSWORD")
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            def store = System.getenv("SIGNING_STORE_FILE")
            if (store != null && !store.trim().isEmpty()) {
                signingConfig signingConfigs.release
            }
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    testOptions {
        unitTests.returnDefaultValues = true
    }
    lint {
        lintConfig file('lint.xml')
        abortOnError false
    }
}

dependencies {
    implementation 'androidx.appcompat:appcompat:1.7.0'
    implementation 'com.airbnb.android:lottie:6.6.0'
    implementation 'com.google.android.material:material:1.12.0'
    implementation 'androidx.recyclerview:recyclerview:1.3.2'
    implementation 'androidx.constraintlayout:constraintlayout:2.1.4'
    implementation 'androidx.swiperefreshlayout:swiperefreshlayout:1.1.0'
    implementation 'com.squareup.okhttp3:okhttp:4.12.0'
    implementation 'com.squareup.okhttp3:okhttp-dnsoverhttps:4.12.0'
    implementation 'com.google.code.gson:gson:2.11.0'
    implementation 'com.github.bumptech.glide:glide:4.16.0'
    implementation 'androidx.media3:media3-exoplayer:1.4.1'
    implementation 'androidx.media3:media3-exoplayer-hls:1.4.1'
    implementation 'androidx.media3:media3-ui:1.4.1'

    testImplementation 'junit:junit:4.13.2'
}
