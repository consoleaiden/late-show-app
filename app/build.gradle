plugins {
    id 'com.android.application'
}

// 版本号由 CI 运行号生成：GITHUB_RUN_NUMBER 存在时 versionName=1.5.<run>，保证每次发布都能被 App 识别为新版本
def ghRun = System.getenv("GITHUB_RUN_NUMBER")
def buildNo = (ghRun != null && ghRun.isNumber()) ? ghRun.toInteger() : 0

android {
    namespace 'com.lateshow.app'
    compileSdk 34

    defaultConfig {
        applicationId "com.lateshow.app"
        minSdk 24
        targetSdk 34
        versionCode buildNo > 0 ? (1000 + buildNo) : 1
        versionName buildNo > 0 ? "1.5.${buildNo}" : "1.5.0"
    }

    buildFeatures {
        buildConfig true
    }

    signingConfigs {
        debug {
            storeFile file('debug.keystore')
            storePassword 'android'
            keyAlias 'androiddebugkey'
            keyPassword 'android'
        }
    }

    buildTypes {
        debug {
            signingConfig signingConfigs.debug
        }
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    implementation 'androidx.appcompat:appcompat:1.7.0'
    implementation 'com.google.android.material:material:1.12.0'
    implementation 'androidx.recyclerview:recyclerview:1.3.2'
    implementation 'androidx.constraintlayout:constraintlayout:2.1.4'
    implementation 'androidx.swiperefreshlayout:swiperefreshlayout:1.1.0'
    implementation 'com.squareup.okhttp3:okhttp:4.12.0'
    implementation 'com.squareup.okhttp3:okhttp-dnsoverhttps:4.12.0'
    implementation 'com.google.code.gson:gson:2.11.0'
    implementation 'com.github.bumptech.glide:glide:4.16.0'
    implementation 'androidx.media3:media3-exoplayer:1.4.1'
    implementation 'androidx.media3:media3-exoplayer-hls:1.4.1'
    implementation 'androidx.media3:media3-ui:1.4.1'
}
